<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呷奔｜後台管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2B1D22; --paper: #FBF6EE; --paper-soft: #F3ECDF;
    --plum: #2B1728; --gold: #C89A3C; --rose: #B85C6B;
    --green: #4C7A5C; --red: #B8453C; --line: rgba(43,29,34,0.14);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif; min-height: 100vh;
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 60px 20px 100px; position: relative; }
  .home-link{
    position: absolute; top: 22px; right: 22px;
    font-size: 12px; letter-spacing: 0.05em; color: var(--ink); opacity: .4;
    text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; transition: opacity .2s ease, border-color .2s ease;
  }
  .home-link:hover{ opacity: .8; border-color: var(--gold); }
  h1{
    font-family: 'Noto Serif TC', serif; font-weight: 900;
    font-size: 30px; color: var(--plum); margin: 0 0 8px; text-align:center;
  }
  .sub{ text-align:center; font-size: 13px; opacity: .55; margin-bottom: 40px; }

  .panel{
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 28px; margin-bottom: 20px;
  }

  label{ display:block; font-size: 12px; letter-spacing: 0.05em; opacity: .6; margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type{ margin-top: 0; }
  label.sub-field{ opacity: .45; font-size: 11px; margin-top: 10px; }
  input[type=password], input[type=text], input[type=date], input[type=url], textarea{
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--paper-soft); color: var(--ink);
  }
  textarea{ resize: vertical; min-height: 80px; line-height: 1.6; }
  input:focus, textarea:focus{ outline: 2px solid var(--gold); outline-offset: 1px; }

  /* ---- horizontal (landscape) field layout ---- */
  .field{ display:flex; align-items:center; gap: 18px; margin-top: 16px; }
  .field:first-of-type{ margin-top: 0; }
  .field > label{ flex: 0 0 160px; margin: 0; }
  .field > input, .field > select, .field > textarea{ flex: 1; min-width: 0; }
  .field.field-sub{ margin-top: 8px; }
  .field.field-sub > label{ flex-basis: 160px; }
  input[type=color]{
    width: 56px; height: 40px; padding: 3px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper-soft); cursor: pointer;
  }
  select{
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--paper-soft); color: var(--ink);
  }
  input[type=number]{
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--paper-soft); color: var(--ink);
  }
  @media (max-width: 640px){
    .field{ flex-direction: column; align-items: stretch; gap: 6px; }
    .field > label{ flex-basis: auto; }
  }

  button{
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 8px; padding: 13px 20px; cursor: pointer;
    width: 100%; margin-top: 22px; transition: opacity .2s ease;
  }
  button:hover{ opacity: .88; }
  button:disabled{ opacity: .5; cursor: not-allowed; }
  .btn-primary{ background: var(--plum); color: var(--paper); }
  .btn-secondary{ background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-back{ background: transparent; color: var(--ink); opacity:.6; border: none; margin-top: 10px; padding: 8px; font-size: 13px; font-weight: 500; }
  .btn-back:hover{ opacity: 1; }

  .hint{ font-size: 12px; opacity: .5; margin-top: 10px; line-height: 1.6; }
  .msg{ font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 16px; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background: rgba(76,122,92,0.12); color: var(--green); }
  .msg.err{ background: rgba(184,69,60,0.1); color: var(--red); }

  .day-block{ border-top: none; padding-top: 0; margin-top: 0; }
  .day-date-preview{ font-size: 12px; opacity: .45; margin-bottom: 10px; }

  .hidden{ display: none; }
  .row{ display:flex; gap: 10px; }
  .row button{ flex: 1; }
  .section-title{
    font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 15px;
    color: var(--plum); margin: 0 0 4px;
  }
  .section-desc{ font-size: 12px; opacity: .5; margin-bottom: 4px; line-height: 1.6; }

  /* ---- menu list ---- */
  .menu-list{ list-style:none; margin:0; padding:0; }
  .menu-item{ border-bottom: 1px solid var(--line); }
  .menu-item:last-child{ border-bottom: none; }
  .menu-item button{
    width:100%; margin-top:0; background:transparent; color:var(--ink);
    text-align:left; padding: 16px 4px; border-radius: 0;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    font-weight: 400;
  }
  .menu-item button:hover{ opacity:1; background: var(--paper-soft); }
  .menu-item-title{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:15px; color:var(--plum); }
  .menu-item-preview{ font-size:12px; opacity:.5; margin-top:3px; max-width: 320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu-item-arrow{ opacity:.35; flex:0 0 auto; }
  .menu-group-title{ font-size: 11px; letter-spacing: 0.08em; opacity: .45; margin: 22px 0 6px; }
  .menu-group-title:first-child{ margin-top: 0; }

  .item-title{
    font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 20px;
    color: var(--plum); margin: 0 0 20px;
  }
</style>
</head>
<body>

<div class="wrap">
  <a class="home-link" href="index.html">回首頁</a>
  <h1>後台管理 Admin Panel</h1>
  <div class="sub">呷奔｜專用系統</div>

  <!-- 步驟 1：密碼登入（密碼存在 menu.json 裡，跨裝置共用） -->
  <div class="panel" id="loginPanel">
    <div class="field">
      <label for="pw">密碼</label>
      <input type="password" id="pw" placeholder="請輸入管理員密碼">
    </div>
    <button class="btn-primary" id="loginBtn">登入</button>
    <div class="msg err" id="loginMsg"></div>
    <div class="hint">若您無法登入，請聯絡系統管理員確認。</div>
  </div>

  <!-- 步驟 2：GitHub 權杖 + 讀取菜單 -->
  <div class="panel hidden" id="tokenPanel">
    <div class="field">
      <label for="owner">GitHub 帳號</label>
      <input type="text" id="owner" value="jason315826">
    </div>
    <div class="field">
      <label for="repo">Repository 名稱</label>
      <input type="text" id="repo" value="ITRI_weekly-menu">
    </div>
    <div class="field">
      <label for="token">GitHub 權杖</label>
      <input type="password" id="token" placeholder="貼上你的 Personal Access Token">
    </div>
    <button class="btn-primary" id="loadBtn">讀取目前菜單</button>
    <div class="msg err" id="tokenMsg"></div>
  </div>

  <!-- 步驟 3：選單 -->
  <div class="panel hidden" id="menuPanel">
    <div class="menu-group-title">(一)、起始日期設定</div>
    <ul class="menu-list" id="menuListTop"></ul>
    <div class="menu-group-title">(二)、每日菜單維護</div>
    <ul class="menu-list" id="menuListDays"></ul>
    <div class="menu-group-title">(三)、其他</div>
    <ul class="menu-list" id="menuListOther"></ul>

    <div class="row">
      <button class="btn-primary" id="saveBtn">儲存並發布</button>
    </div>
    <button class="btn-secondary" id="clearAllBtn">清除全部品項</button>
    <button class="btn-secondary" id="logoutBtn">登出</button>
    <div class="msg" id="saveMsg"></div>
  </div>

  <!-- 步驟 4：單一項目編輯 -->
  <div class="panel hidden" id="itemPanel">
    <div class="item-title" id="itemTitle"></div>
    <div id="itemBody"></div>
    <button class="btn-back" id="backBtn">← 返回選單</button>
  </div>
</div>

<script>
  const DAY_NAMES = ['週一','週二','週三','週四','週五'];
  const DEFAULT_PASSWORD = 'itri18899';

  const loginPanel = document.getElementById('loginPanel');
  const tokenPanel = document.getElementById('tokenPanel');
  const menuPanel = document.getElementById('menuPanel');
  const itemPanel = document.getElementById('itemPanel');

  let currentSha = null;
  let currentData = null;
  let pendingPassword = null;

  const savedToken = localStorage.getItem('menuAdminToken');
  if (savedToken) document.getElementById('token').value = savedToken;

  function getCachedPassword(){
    return localStorage.getItem('menuAdminPwCache') || DEFAULT_PASSWORD;
  }
  function setCachedPassword(pw){
    localStorage.setItem('menuAdminPwCache', pw);
  }

  document.getElementById('loginBtn').onclick = () => {
    const pw = document.getElementById('pw').value;
    if (pw === getCachedPassword()) {
      pendingPassword = pw;
      loginPanel.classList.add('hidden');
      tokenPanel.classList.remove('hidden');
    } else {
      showMsg('loginMsg', '密碼錯誤,請再試一次', false);
    }
  };

  function showMsg(id, text, ok){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }

  function apiBase(){
    const owner = document.getElementById('owner').value.trim();
    const repo = document.getElementById('repo').value.trim();
    return `https://api.github.com/repos/${owner}/${repo}/contents/menu.json`;
  }

  function pad2(n){ return String(n).padStart(2, '0'); }
  function addDays(dateStr, n){
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d;
  }
  function escapeHtml(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const DEFAULT_STYLES = {
    title: { fontSize: 46, color: '#2B1728', bold: true },
    item:  { fontSize: 19, color: '#2B1728', bold: true },
    notes: { fontSize: 17, color: '#2B1D22', bold: false }
  };
  function getStyles(){
    const s = currentData.styles || {};
    return {
      title: { ...DEFAULT_STYLES.title, ...(s.title || {}) },
      item:  { ...DEFAULT_STYLES.item,  ...(s.item  || {}) },
      notes: { ...DEFAULT_STYLES.notes, ...(s.notes || {}) }
    };
  }

  document.getElementById('loadBtn').onclick = async () => {
    const token = document.getElementById('token').value.trim();
    if (!token) { showMsg('tokenMsg', '請輸入 GitHub 權杖', false); return; }
    localStorage.setItem('menuAdminToken', token);

    try{
      const res = await fetch(apiBase(), {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) {
        showMsg('tokenMsg', `讀取失敗(${res.status})：請確認帳號/repo名稱正確、權杖有效且有 Contents 讀寫權限`, false);
        return;
      }
      const file = await res.json();
      currentSha = file.sha;
      currentData = JSON.parse(b64DecodeUtf8(file.content));
      delete currentData.presets;
      currentData.days.forEach(d => {
        if (d.lunchLink === undefined) d.lunchLink = '';
        if (d.drinkLink === undefined) d.drinkLink = '';
      });
      if (!currentData.password) currentData.password = DEFAULT_PASSWORD;

      // 用 GitHub 上真正的密碼做最終確認，並讓本機快取的密碼保持最新
      if (pendingPassword === currentData.password) {
        setCachedPassword(currentData.password);
        tokenPanel.classList.add('hidden');
        showMenu();
      } else {
        setCachedPassword(currentData.password);
        tokenPanel.classList.add('hidden');
        loginPanel.classList.remove('hidden');
        document.getElementById('pw').value = '';
        showMsg('loginMsg', '密碼已在其他裝置更新，請輸入最新密碼再登入一次', false);
      }
    }catch(err){
      showMsg('tokenMsg', '連線失敗：' + err.message, false);
    }
  };

  // ---------- menu ----------
  function truncate(s, n){
    if (!s) return '（未設定）';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function showMenu(){
    itemPanel.classList.add('hidden');
    menuPanel.classList.remove('hidden');
    document.getElementById('saveMsg').className = 'msg';

    const topItems = [
      { id: 'weekStart', title: '本週「週一」的日期',
        preview: currentData.weekStart ? currentData.weekStart : '（未設定）' }
    ];
    document.getElementById('menuListTop').innerHTML = topItems.map(renderMenuItem).join('');

    const dayItems = currentData.days.map((d, i) => {
      const dt = currentData.weekStart ? addDays(currentData.weekStart, i) : null;
      const dateStr = dt ? `${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())} ` : '';
      const lunch = d.lunch ? `中餐：${d.lunch}` : '中餐：（未設定）';
      const drink = d.drink ? '｜下午茶：' + d.drink : '';
      return { id: 'day' + i, title: `${dateStr}${DAY_NAMES[i]}`, preview: lunch + drink };
    });
    document.getElementById('menuListDays').innerHTML = dayItems.map(renderMenuItem).join('');

    const otherItems = [
      { id: 'notes', title: '備註',
        preview: (currentData.notes && currentData.notes.length) ? `共 ${currentData.notes.length} 項` : '（未設定）' },
      { id: 'orderLink', title: '訂餐系統按鈕連結',
        preview: currentData.orderLink ? truncate(currentData.orderLink, 34) : '（未設定）' },
      { id: 'styles', title: '文字樣式設定', preview: '標題／品項／備註的字級、顏色、粗細' },
      { id: 'password', title: '密碼設定 (Beta)', preview: '修改後台登入密碼' }
    ];
    document.getElementById('menuListOther').innerHTML = otherItems.map(renderMenuItem).join('');

    document.querySelectorAll('.menu-item button').forEach(btn => {
      btn.onclick = () => openItem(btn.dataset.id);
    });
  }

  function renderMenuItem(item){
    return `
      <li class="menu-item">
        <button type="button" data-id="${item.id}">
          <span>
            <div class="menu-item-title">${item.title}</div>
            <div class="menu-item-preview">${escapeHtml(item.preview)}</div>
          </span>
          <span class="menu-item-arrow">›</span>
        </button>
      </li>`;
  }

  document.getElementById('clearAllBtn').onclick = () => {
    if (!confirm('確定要清除全部 5 天的中餐與下午茶品項嗎？')) return;
    currentData.days.forEach(d => { d.lunch=''; d.lunchLink=''; d.drink=''; d.drinkLink=''; });
    showMenu();
  };

  document.getElementById('logoutBtn').onclick = () => {
    location.reload();
  };

  document.getElementById('backBtn').onclick = () => showMenu();

  document.getElementById('saveBtn').onclick = async () => {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '儲存中…';

    currentData.lastUpdated = new Date().toISOString();
    const token = document.getElementById('token').value.trim();
    const newContent = b64EncodeUtf8(JSON.stringify(currentData, null, 2));

    try{
      const res = await fetch(apiBase(), {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: '更新菜單（後台）',
          content: newContent,
          sha: currentSha
        })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        showMsg('saveMsg', `儲存失敗(${res.status})：${errData.message || '請檢查權杖權限'}`, false);
        btn.disabled = false;
        btn.textContent = '儲存並發布';
        return;
      }
      const result = await res.json();
      currentSha = result.content.sha;
      showMsg('saveMsg', '已儲存！網站約 1 分鐘後會更新完成', true);
    }catch(err){
      showMsg('saveMsg', '儲存失敗：' + err.message, false);
    }
    btn.disabled = false;
    btn.textContent = '儲存並發布';
  };

  // ---------- item editor ----------
  function openItem(id){
    menuPanel.classList.add('hidden');
    itemPanel.classList.remove('hidden');
    document.getElementById('itemTitle').textContent = itemTitleFor(id);
    document.getElementById('itemBody').innerHTML = itemBodyFor(id);
    wireItem(id);
  }

  function itemTitleFor(id){
    if (id === 'weekStart') return '本週「週一」日期';
    if (id.startsWith('day')) return DAY_NAMES[parseInt(id.replace('day',''))] + ' 菜單';
    if (id === 'notes') return '備註';
    if (id === 'orderLink') return '訂餐系統按鈕連結';
    if (id === 'styles') return '文字樣式設定';
    if (id === 'password') return '密碼設定';
    return '';
  }

  function itemBodyFor(id){
    if (id === 'weekStart'){
      return `
        <div class="field">
          <label for="f_weekStart">本週「週一」的日期</label>
          <input type="date" id="f_weekStart" value="${currentData.weekStart || ''}">
        </div>
        <div class="hint">選擇本週「週一」的日期，系統將自動計算並顯示週一到週五的正確日期。</div>
        <button class="btn-primary" id="applyBtn">儲存並返回選單</button>`;
    }
    if (id.startsWith('day')){
      const i = parseInt(id.replace('day',''));
      const d = currentData.days[i];
      return `
        <div class="section-title">中餐</div>
        <div class="field">
          <label>品項</label>
          <input type="text" id="f_lunch" value="${escapeHtml(d.lunch)}">
        </div>
        <div class="field field-sub">
          <label class="sub-field">超連結</label>
          <input type="url" id="f_lunchLink" value="${escapeHtml(d.lunchLink)}" placeholder=" ">
        </div>

        <div class="section-title" style="margin-top:20px">下午茶飲料</div>
        <div class="field">
          <label>品項</label>
          <input type="text" id="f_drink" value="${escapeHtml(d.drink)}">
        </div>
        <div class="field field-sub">
          <label class="sub-field">超連結</label>
          <input type="url" id="f_drinkLink" value="${escapeHtml(d.drinkLink)}" placeholder=" ">
        </div>

        <button class="btn-primary" id="applyBtn">儲存並返回選單</button>
        <button class="btn-secondary" id="clearDayBtn">清除本日品項</button>`;
    }
    if (id === 'notes'){
      return `
        <label for="f_notes">每一行請列為一項提醒事項；如同一項提醒事項需分行呈現，請使用鍵盤 Shift + Enter 進行換行。</label>
        <textarea id="f_notes" placeholder="（一）、當日菜單請以群組為主。">${escapeHtml((currentData.notes || []).join('\n'))}</textarea>
        <button class="btn-primary" id="applyBtn">儲存並返回選單</button>`;
    }
    if (id === 'orderLink'){
      return `
        <div class="field">
          <label for="f_orderLink">訂餐系統按鈕連結</label>
          <input type="url" id="f_orderLink" value="${escapeHtml(currentData.orderLink)}" placeholder="https://...">
        </div>
        <div class="hint">此按鈕可連結至揪團系統。</div>
        <button class="btn-primary" id="applyBtn">儲存並返回選單</button>`;
    }
    if (id === 'styles'){
      const s = getStyles();
      const section = (key, label) => `
        <div class="section-title" style="margin-top:20px">${label}</div>
        <div class="field field-sub">
          <label class="sub-field">字級 (px)</label>
          <input type="number" id="f_${key}Size" min="10" max="90" value="${s[key].fontSize}">
        </div>
        <div class="field field-sub">
          <label class="sub-field">顏色</label>
          <input type="color" id="f_${key}Color" value="${s[key].color}">
        </div>
        <div class="field field-sub">
          <label class="sub-field">粗細</label>
          <select id="f_${key}Bold">
            <option value="1" ${s[key].bold ? 'selected' : ''}>粗體</option>
            <option value="0" ${!s[key].bold ? 'selected' : ''}>一般</option>
          </select>
        </div>`;
      return `
        ${section('title', '標題（頁面主標題）')}
        ${section('item', '品項（中餐／下午茶內容文字）')}
        ${section('notes', '備註文字')}
        <button class="btn-primary" id="applyBtn" style="margin-top:22px">儲存並返回選單</button>`;
    }
    if (id === 'password'){
      return `
        <div class="hint" style="margin-top:0">原始密碼會預設儲存於瀏覽器的快取，修改密碼完成後按選單的「儲存並發布」才會同步到系統。</div>
        <div class="field">
          <label for="f_curPw">目前密碼</label>
          <input type="password" id="f_curPw" placeholder="請輸入目前密碼">
        </div>
        <div class="field">
          <label for="f_newPw1">新密碼</label>
          <input type="password" id="f_newPw1" placeholder="請輸入新密碼">
        </div>
        <div class="field">
          <label for="f_newPw2">確認新密碼</label>
          <input type="password" id="f_newPw2" placeholder="請再輸入一次新密碼">
        </div>
        <button class="btn-primary" id="applyPwBtn">更新密碼</button>
        <div class="msg" id="pwMsg"></div>`;
    }
    return '';
  }

  function wireItem(id){
    if (id === 'weekStart'){
      document.getElementById('applyBtn').onclick = () => {
        currentData.weekStart = document.getElementById('f_weekStart').value;
        showMenu();
      };
    } else if (id.startsWith('day')){
      const i = parseInt(id.replace('day',''));
      document.getElementById('applyBtn').onclick = () => {
        currentData.days[i].lunch = document.getElementById('f_lunch').value.trim();
        currentData.days[i].lunchLink = document.getElementById('f_lunchLink').value.trim();
        currentData.days[i].drink = document.getElementById('f_drink').value.trim();
        currentData.days[i].drinkLink = document.getElementById('f_drinkLink').value.trim();
        showMenu();
      };
      document.getElementById('clearDayBtn').onclick = () => {
        if (!confirm(`確定要清除${DAY_NAMES[i]}的中餐與下午茶品項嗎？`)) return;
        currentData.days[i] = { lunch:'', lunchLink:'', drink:'', drinkLink:'' };
        showMenu();
      };
    } else if (id === 'notes'){
      document.getElementById('applyBtn').onclick = () => {
        currentData.notes = document.getElementById('f_notes').value
          .split('\n').map(s => s.trim()).filter(Boolean);
        showMenu();
      };
    } else if (id === 'orderLink'){
      document.getElementById('applyBtn').onclick = () => {
        currentData.orderLink = document.getElementById('f_orderLink').value.trim();
        showMenu();
      };
    } else if (id === 'styles'){
      document.getElementById('applyBtn').onclick = () => {
        const read = (key) => ({
          fontSize: parseFloat(document.getElementById(`f_${key}Size`).value) || DEFAULT_STYLES[key].fontSize,
          color: document.getElementById(`f_${key}Color`).value,
          bold: document.getElementById(`f_${key}Bold`).value === '1'
        });
        currentData.styles = {
          title: read('title'),
          item: read('item'),
          notes: read('notes')
        };
        showMenu();
      };
    } else if (id === 'password'){
      document.getElementById('applyPwBtn').onclick = () => {
        const cur = document.getElementById('f_curPw').value;
        const new1 = document.getElementById('f_newPw1').value;
        const new2 = document.getElementById('f_newPw2').value;
        const showPwMsg = (text, ok) => {
          const el = document.getElementById('pwMsg');
          el.textContent = text;
          el.className = 'msg show ' + (ok ? 'ok' : 'err');
        };
        if (cur !== (currentData.password || DEFAULT_PASSWORD)) { showPwMsg('目前密碼不正確', false); return; }
        if (!new1) { showPwMsg('請輸入新密碼', false); return; }
        if (new1 !== new2) { showPwMsg('兩次輸入的新密碼不一致', false); return; }
        currentData.password = new1;
        setCachedPassword(new1);
        showPwMsg('密碼已更新，記得按「儲存並發布」才會同步到 GitHub', true);
        document.getElementById('f_curPw').value = '';
        document.getElementById('f_newPw1').value = '';
        document.getElementById('f_newPw2').value = '';
      };
    }
  }
</script>

</body>
</html>
