<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呷奔 | 一週菜單</title>
<script>
  // 在畫面渲染前先套用已儲存的主題設定，避免閃爍。預設為淺色模式。
  (function(){
    try{
      if (localStorage.getItem('themePreference') === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2B1D22;
    --paper: #FBF6EE;
    --paper-soft: #F3ECDF;
    --plum: #2B1728;
    --gold: #C89A3C;
    --rose: #B85C6B;
    --line: rgba(43,29,34,0.12);
    /* 固定強調色：無論深淺模式，「今日」卡片與揪團按鈕都維持一致的辨識度 */
    --accent-bg: #5B2A46;
    --accent-text: #FBF6EE;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --ink: #EAE1D5;
    --paper: #1B1317;
    --paper-soft: #251A20;
    --plum: #F0DDBC;
    --gold: #E0B563;
    --rose: #E2919F;
    --line: rgba(234,225,213,0.14);
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--paper);
    background-image: radial-gradient(circle at 10% 0%, rgba(200,154,60,0.07), transparent 40%),
                       radial-gradient(circle at 95% 100%, rgba(184,92,107,0.06), transparent 40%);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color .3s ease, color .3s ease;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 56px 22px 60px; position: relative; }

  .top-actions{
    position: absolute; top: 22px; right: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .admin-link{
    font-size: 12px; letter-spacing: 0.05em; color: var(--ink); opacity: .35;
    text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; transition: opacity .2s ease, border-color .2s ease;
  }
  .admin-link:hover{ opacity: .75; border-color: var(--gold); }

  .theme-toggle{
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--ink); opacity: .5; cursor: pointer;
    transition: opacity .2s ease, border-color .2s ease, color .2s ease;
  }
  .theme-toggle:hover{ opacity: .9; border-color: var(--gold); }
  .theme-toggle svg{ width: 15px; height: 15px; display: block; }
  .theme-toggle .icon-moon{ display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display: block; }

  header{ text-align: center; margin-bottom: 52px; animation: fadeUp .7s ease both; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size: 12px; letter-spacing: 0.32em; color: var(--rose); margin-bottom: 16px;
  }
  .eyebrow::before, .eyebrow::after{ content:""; width: 26px; height: 1px; background: var(--rose); opacity: .5; }
  h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: var(--title-weight, 900);
    font-size: var(--title-font-size, clamp(38px, 6vw, 58px)); line-height: 1.15;
    margin: 0 0 12px; color: var(--title-color, var(--plum)); letter-spacing: 0.02em;
  }
  .date-range{ font-size: 14px; color: var(--ink); opacity: .6; letter-spacing: 0.05em; }
  .legend{ display: flex; justify-content: center; gap: 28px; margin-top: 26px; font-size: 13px; color: var(--ink); opacity: .75; }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend svg{ width:16px; height:16px; }

  .live-clock{
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 12px; padding: 6px 16px;
    border: 1px solid var(--line); border-radius: 999px;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; letter-spacing: 0.04em; color: var(--ink); opacity: .7;
    font-variant-numeric: tabular-nums;
  }
  .live-clock .clock-dot{ opacity: .4; }
  .live-clock #clockTime{ font-weight: 700; color: var(--rose); }
  .live-clock .clock-tz{
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px; letter-spacing: 0.06em; opacity: .6;
    border-left: 1px solid var(--line); padding-left: 8px; margin-left: 2px;
  }
  @media (max-width: 520px){
    .live-clock{ font-size: 12px; padding: 5px 14px; }
  }

  .deck{ display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .day-card{
    position: relative; background: var(--paper);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 30px 20px 34px; animation: fadeUp .7s ease both; transition: background .25s ease;
  }
  .day-card:hover{ background: var(--paper-soft); }
  .day-card.is-today{ background: var(--accent-bg); color: var(--accent-text); }
  .day-card.is-today .num{ color: var(--gold); }
  .day-card.is-today .day-name{ color: var(--accent-text); }
  .day-card.is-today .day-date{ color: rgba(251,246,238,0.6); }
  .day-card.is-today .item-label{ color: var(--gold); opacity: 1; }
  .day-card.is-today .item-value{ color: var(--accent-text); }
  .day-card.is-today .divider{ background: rgba(251,246,238,0.18); }
  .day-card.is-today .icon{ color: var(--gold); }
  .day-card.is-today::before{
    content: "今日"; position: absolute; top: 14px; right: 16px;
    font-size: 11px; letter-spacing: 0.1em; color: var(--gold);
    border: 1px solid rgba(200,154,60,0.5); border-radius: 999px; padding: 2px 10px;
  }

  .num{ font-family: 'Noto Serif TC', serif; font-size: 16px; color: var(--rose); letter-spacing: 0.1em; margin-bottom: 6px; }
  .day-name{ font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 28px; color: var(--plum); margin-bottom: 2px; }
  .day-date{ font-size: 13px; color: var(--ink); opacity: .55; margin-bottom: 24px; }
  .divider{ width: 100%; height: 1px; background: var(--line); margin: 20px 0; }
  .item{ display: flex; align-items: flex-start; gap: 11px; margin-bottom: 4px; }
  .icon{ flex: 0 0 auto; width: 22px; height: 22px; color: var(--gold); margin-top: 3px; }
  .item-body{ flex: 1; min-width: 0; }
  .item-label{ font-size: 11.5px; letter-spacing: 0.08em; color: var(--rose); opacity: .8; margin-bottom: 4px; font-weight: 700; }
  .item-value{
    font-size: var(--item-font-size, 18.5px);
    font-weight: var(--item-weight, 700);
    line-height: 1.45; color: var(--item-color, var(--plum));
    overflow-wrap: break-word; word-break: break-word;
    display: inline-block; text-decoration: none;
  }
  a.item-value.linked{
    border-bottom: 2px dashed var(--gold);
    transition: color .2s ease, border-color .2s ease;
  }
  a.item-value.linked:hover{ color: var(--rose); border-color: var(--rose); }
  .day-card.is-today a.item-value.linked{ border-color: var(--gold); }
  .day-card.is-today a.item-value.linked:hover{ color: var(--gold); }
  .link-icon{ width: 13px; height: 13px; margin-left: 4px; vertical-align: 2px; opacity: .7; }

  /* ---------- Notes block ---------- */
  .notes{
    margin-top: 40px;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    padding: 24px 28px;
  }
  .notes-title{
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--plum);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }
  .notes ul{ margin: 0; padding: 0; list-style: none; }
  .notes li{
    font-size: var(--notes-font-size, 17px);
    line-height: 1.9;
    color: var(--notes-color, var(--ink));
    font-weight: var(--notes-weight, 500);
  }

  .footer-meta{
    margin-top: 22px;
    text-align: right;
    font-size: 12.5px;
    color: var(--ink);
    opacity: .45;
  }

  .order-fab{
    position: fixed; right: 20px; bottom: 20px;
    background: var(--accent-bg); color: var(--accent-text);
    padding: 14px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 700; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 24px rgba(43,23,40,0.32);
    transition: transform .2s ease, box-shadow .2s ease;
    z-index: 50;
  }
  .order-fab:hover{ transform: translateY(-3px); box-shadow: 0 14px 30px rgba(43,23,40,0.4); }
  .order-fab svg{ width: 17px; height: 17px; }

  .loading{ text-align:center; padding: 60px 0; opacity:.5; font-size:14px; }

  /* ---------- 轉盤：今天吃什麼 ---------- */
  .wheel-fab{
    position: fixed; left: 20px; bottom: 20px;
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent-bg); color: var(--accent-text);
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(43,23,40,0.32);
    transition: transform .2s ease, box-shadow .2s ease;
    z-index: 50;
  }
  .wheel-fab:hover{ transform: translateY(-3px) rotate(18deg); box-shadow: 0 14px 30px rgba(43,23,40,0.4); }
  .wheel-fab svg{ width: 28px; height: 28px; }

  .wheel-overlay{
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(20,12,16,0.55); backdrop-filter: blur(2px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .wheel-overlay.open{ display: flex; }
  .wheel-modal{
    position: relative; width: 100%; max-width: 340px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px 22px 26px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    animation: fadeUp .35s ease both;
  }
  .wheel-close{
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; font-size: 16px; line-height: 1;
    color: var(--ink); opacity: .45; cursor: pointer; padding: 6px;
  }
  .wheel-close:hover{ opacity: .9; }
  .wheel-modal-title{
    font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 20px;
    color: var(--plum); margin-bottom: 18px;
  }
  .wheel-stage{
    position: relative; width: 240px; height: 240px; margin: 0 auto;
  }
  .wheel-pointer{
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 3;
    border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-top: 18px solid var(--gold);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .wheel-canvas{
    display: block; border-radius: 50%;
    box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--line), 0 14px 28px rgba(0,0,0,0.22);
  }
  .wheel-spin-btn{
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%; z-index: 2;
    background: var(--accent-bg); color: var(--accent-text);
    border: 3px solid var(--paper); font-family: 'Noto Serif TC', serif;
    font-weight: 900; font-size: 14px; letter-spacing: 0.05em; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    transition: transform .15s ease;
  }
  .wheel-spin-btn:hover{ transform: translate(-50%, -50%) scale(1.06); }
  .wheel-spin-btn:disabled{ opacity: .7; cursor: not-allowed; transform: translate(-50%, -50%); }
  .wheel-result{
    min-height: 24px; margin-top: 20px;
    font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px;
    color: var(--rose);
  }
  .wheel-empty{ margin-top: 16px; font-size: 13px; opacity: .55; line-height: 1.7; }
  @media (max-width: 380px){
    .wheel-stage{ width: 210px; height: 210px; }
  }
  @keyframes fadeUp{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }
  @media (max-width: 860px){ .deck{ grid-template-columns: repeat(2, minmax(0, 1fr)); border-left: 1px solid var(--line); } }
  @media (max-width: 520px){
    .deck{ grid-template-columns: 1fr; }
    .legend{ flex-direction: column; align-items: center; gap: 10px; }
    .top-actions{ position: static; justify-content: center; margin-bottom: 20px; }
    .wrap{ padding-top: 40px; padding-bottom: 100px; }
    .footer-meta{ text-align: center; }
    .order-fab{ right: 16px; bottom: 16px; padding: 12px 18px; font-size: 13px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="icon-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">

    <path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/>
    <path d="M8 5c.5-1 .2-1.5-.3-2M12 5c.5-1 .2-1.5-.3-2"/>
  </symbol>
  <symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>

  </symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">

<div class="wrap">
  <div class="top-actions">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色模式">
      <svg class="icon-sun"><use href="#icon-sun"/></svg>
      <svg class="icon-moon"><use href="#icon-moon"/></svg>
    </button>
    <a class="admin-link" href="admin.html">登入</a>
  </div>

  <header>
    <div class="eyebrow">LUNCH &amp; TEA TIME</div>
    <h1>大家作伙來呷奔</h1>
    <div class="date-range" id="dateRange">載入中…</div>
    <div class="live-clock" id="liveClock">
      <span id="clockDate">--</span>
      <span class="clock-dot">·</span>
      <span id="clockTime">--:--:--</span>
      <span class="clock-tz" id="clockTz">--</span>
    </div>
    <div class="legend">
      <span><svg class="icon"><use href="#icon-bowl"/></svg>中餐</span>
      <span><svg class="icon"><use href="#icon-cup"/></svg>下午茶/飲料</span>
    </div>
  </header>

  <div class="deck" id="deck">
    <div class="loading">菜單載入中…</div>
  </div>

  <div class="notes" id="notesBlock" style="display:none">
    <div class="notes-title">提醒：</div>
    <ul id="notesList"></ul>
  </div>

  <div class="footer-meta" id="footerMeta"></div>
</div>

<a class="order-fab" id="orderFab" style="display:none" target="_blank" rel="noopener">
  <svg><use href="#icon-plus"/></svg>
  開始揪團
</a>

<button class="wheel-fab" id="wheelFab" type="button" title="今天吃什麼？轉一下">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 3v9l6.2 3.6M12 3a9 9 0 0 1 7.79 4.5M12 21a9 9 0 0 1-7.79-13.5"/>

  </svg>
</button>

<div class="wheel-overlay" id="wheelOverlay">
  <div class="wheel-modal">
    <button class="wheel-close" id="wheelClose" type="button" aria-label="關閉">✕</button>
    <div class="wheel-modal-title">今天吃什麼？</div>
    <div class="wheel-stage" id="wheelStage">
      <div class="wheel-pointer"></div>
      <canvas class="wheel-canvas" id="wheelCanvas"></canvas>
      <button class="wheel-spin-btn" id="wheelSpinBtn" type="button">抽獎</button>
    </div>
    <div class="wheel-result" id="wheelResult"></div>

  </div>
</div>

<script>
  const DAY_META = [
    { num: '壹', name: '週一' },
    { num: '貳', name: '週二' },
    { num: '參', name: '週三' },
    { num: '肆', name: '週四' },
    { num: '伍', name: '週五' }
  ];

  // ---------- 深色模式切換 ----------
  (function(){
    const btn = document.getElementById('themeToggle');
    btn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark){
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      try{ localStorage.setItem('themePreference', isDark ? 'light' : 'dark'); }catch(e){}
    });
  })();

  // ---------- 即時時鐘 ----------
  (function(){
    const dateEl = document.getElementById('clockDate');
    const timeEl = document.getElementById('clockTime');
    const tzEl = document.getElementById('clockTz');
    const WEEKDAY = ['日','一','二','三','四','五','六'];

    // 顯示台灣時區時間；同時標示使用者瀏覽器實際所在時區
    const TARGET_TZ = 'Asia/Taipei';
    let localTzLabel = TARGET_TZ === Intl.DateTimeFormat().resolvedOptions().timeZone
      ? 'Taiwan Time' : `Taiwan Time (browser: ${Intl.DateTimeFormat().resolvedOptions().timeZone})`;
    tzEl.textContent = localTzLabel;

    function tick(){
      const now = new Date();
      const parts = new Intl.DateTimeFormat('zh-TW', {
        timeZone: TARGET_TZ,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        weekday: 'short', hour12: false
      }).formatToParts(now).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});

      dateEl.textContent = `${parts.year}/${parts.month}/${parts.day}（${WEEKDAY[new Date(now.toLocaleString('en-US', {timeZone: TARGET_TZ})).getDay()]}）`;
      timeEl.textContent = `${parts.hour}:${parts.minute}:${parts.second}`;
    }
    tick();
    setInterval(tick, 1000);
  })();

  function pad2(n){ return String(n).padStart(2, '0'); }

  function addDays(dateStr, n){
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d;
  }

  function isSameDate(a, b){
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  function formatLastUpdated(iso){
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())} 更新`;
  }

  function applyStyles(styles){
    if (!styles) return;
    const root = document.documentElement.style;
    const map = {
      title: ['--title-font-size', '--title-color', '--title-weight'],
      item:  ['--item-font-size',  '--item-color',  '--item-weight'],
      notes: ['--notes-font-size', '--notes-color', '--notes-weight']
    };
    Object.keys(map).forEach(key => {
      const s = styles[key];
      if (!s) return;
      const [sizeVar, colorVar, weightVar] = map[key];
      if (s.fontSize) root.setProperty(sizeVar, s.fontSize + 'px');
      if (s.color) root.setProperty(colorVar, s.color);
      if (s.bold !== undefined) root.setProperty(weightVar, s.bold ? '700' : '400');
    });
  }

  function itemValueHtml(text, link){
    const safeText = text || '';
    if (link && link.trim()){
      return `<a class="item-value linked" href="${link}" target="_blank" rel="noopener">${safeText}<svg class="link-icon"><use href="#icon-link"/></svg></a>`;
    }
    return `<span class="item-value">${safeText}</span>`;
  }

  async function loadMenu(){
    try{
      const res = await fetch('menu.json?_=' + Date.now());
      const data = await res.json();
      applyStyles(data.styles);
      const today = new Date();

      const dates = [0,1,2,3,4].map(i => addDays(data.weekStart, i));
      const mon = dates[0], fri = dates[4];
      document.getElementById('dateRange').textContent =
        `${mon.getMonth()+1} 月 ${mon.getDate()} 日（一）— ${fri.getMonth()+1} 月 ${fri.getDate()} 日（五）`;

      const deck = document.getElementById('deck');
      deck.innerHTML = data.days.map((d, i) => {
        const dt = dates[i];
        const meta = DAY_META[i];
        const isToday = isSameDate(dt, today);
        return `
        <div class="day-card${isToday ? ' is-today' : ''}">
          <div class="num">${meta.num}</div>
          <div class="day-name">${meta.name}</div>
          <div class="day-date">${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())}</div>
          <div class="item">
            <svg class="icon"><use href="#icon-bowl"/></svg>
            <div class="item-body">
              <div class="item-label">中餐</div>
              ${itemValueHtml(d.lunch, d.lunchLink)}
            </div>
          </div>
          <div class="divider"></div>
          <div class="item">
            <svg class="icon"><use href="#icon-cup"/></svg>
            <div class="item-body">
              <div class="item-label">下午茶</div>
              ${itemValueHtml(d.drink, d.drinkLink)}
            </div>
          </div>
        </div>`;
      }).join('');

      if (data.notes && data.notes.length){
        document.getElementById('notesList').innerHTML =
          data.notes.map(n => `<li>${n}</li>`).join('');
        document.getElementById('notesBlock').style.display = 'block';
      }

      if (data.lastUpdated){
        document.getElementById('footerMeta').textContent = '最後更新：' + formatLastUpdated(data.lastUpdated);
      }

      if (data.orderLink && data.orderLink.trim()){
        const fab = document.getElementById('orderFab');
        fab.href = data.orderLink;
        fab.style.display = 'inline-flex';
      }

      wheelOptions = Array.isArray(data.wheelOptions) ? data.wheelOptions.filter(s => (s || '').trim()) : [];
    }catch(err){
      document.getElementById('deck').innerHTML = '<div class="loading">菜單讀取失敗,請稍後再試</div>';
    }
  }
  loadMenu();

  // ---------- 轉盤：今天吃什麼 ----------
  let wheelOptions = [];
  let wheelDrawn = false;
  let wheelSpinning = false;
  let wheelTotalRotation = 0;
  const WHEEL_SIZE = 240;
  const WHEEL_COLORS = ['#5B2A46', '#C89A3C', '#B85C6B', '#4C7A5C', '#2B1728', '#E0B563', '#8B4A63', '#7A8F6B'];

  const wheelFab = document.getElementById('wheelFab');
  const wheelOverlay = document.getElementById('wheelOverlay');
  const wheelClose = document.getElementById('wheelClose');
  const wheelCanvas = document.getElementById('wheelCanvas');
  const wheelSpinBtn = document.getElementById('wheelSpinBtn');
  const wheelResult = document.getElementById('wheelResult');
  const wheelEmpty = document.getElementById('wheelEmpty');
  const wheelStage = document.getElementById('wheelStage');

  function setupWheelCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const size = wheelStage.offsetWidth || WHEEL_SIZE;
    wheelCanvas.width = size * dpr;
    wheelCanvas.height = size * dpr;
    wheelCanvas.style.width = size + 'px';
    wheelCanvas.style.height = size + 'px';
    const ctx = wheelCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, size };
  }

  function drawWheel(){
    const { ctx, size } = setupWheelCanvas();
    const cx = size / 2, cy = size / 2, radius = size / 2 - 3;
    ctx.clearRect(0, 0, size, size);
    const n = wheelOptions.length;
    if (!n) return;
    const seg = 360 / n;
    for (let i = 0; i < n; i++){
      const startDeg = i * seg - 90;
      const endDeg = (i + 1) * seg - 90;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, startDeg * Math.PI / 180, endDeg * Math.PI / 180);
      ctx.closePath();
      ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
      ctx.fill();
      ctx.strokeStyle = 'rgba(251,246,238,0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const midRad = (startDeg + seg / 2) * Math.PI / 180;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(midRad);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FBF6EE';
      const fontSize = Math.max(11, Math.min(15, 170 / n));
      ctx.font = '600 ' + fontSize + 'px "Noto Sans TC", sans-serif';
      let label = wheelOptions[i];
      const maxChars = Math.max(4, Math.floor((radius - 16) / (fontSize * 0.62)));
      if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
      ctx.fillText(label, radius - 14, 0);
      ctx.restore();
    }
  }

  function openWheel(){
    wheelOverlay.classList.add('open');
    if (!wheelOptions.length){
      wheelStage.style.display = 'none';
      wheelResult.style.display = 'none';
      wheelEmpty.style.display = 'block';
      return;
    }
    wheelStage.style.display = '';
    wheelResult.style.display = '';
    wheelEmpty.style.display = 'none';
    if (!wheelDrawn){
      drawWheel();
      wheelDrawn = true;
    }
  }

  function closeWheel(){
    wheelOverlay.classList.remove('open');
  }

  function spinWheel(){
    if (wheelSpinning || !wheelOptions.length) return;
    wheelSpinning = true;
    wheelSpinBtn.disabled = true;
    wheelResult.textContent = '';

    const n = wheelOptions.length;
    const seg = 360 / n;
    const idx = Math.floor(Math.random() * n);
    const jitter = (Math.random() - 0.5) * seg * 0.6;
    const centerDeg = idx * seg + seg / 2 + jitter;

    const currentMod = wheelTotalRotation % 360;
    const neededMod = (360 - centerDeg + 360) % 360;
    let delta = neededMod - currentMod;
    if (delta <= 0) delta += 360;
    const extraSpins = (6 + Math.floor(Math.random() * 3)) * 360;
    wheelTotalRotation += extraSpins + delta;

    wheelCanvas.style.transition = 'transform 4.2s cubic-bezier(0.17,0.67,0.32,1.01)';
    wheelCanvas.style.transform = `rotate(${wheelTotalRotation}deg)`;

    setTimeout(() => {
      wheelSpinning = false;
      wheelSpinBtn.disabled = false;
      wheelResult.textContent = '就決定是「' + wheelOptions[idx] + '」了！';
    }, 4300);
  }

  wheelFab.addEventListener('click', openWheel);
  wheelClose.addEventListener('click', closeWheel);
  wheelOverlay.addEventListener('click', (e) => { if (e.target === wheelOverlay) closeWheel(); });
  wheelSpinBtn.addEventListener('click', spinWheel);
</script>

</body>
</html>
