<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呷奔｜一週菜單後台管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2B1D22; --paper: #FBF6EE; --paper-soft: #F3ECDF;
    --plum: #2B1728; --gold: #C89A3C; --rose: #B85C6B;
    --green: #4C7A5C; --red: #B8453C; --line: rgba(43,29,34,0.14);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif; min-height: 100vh;
  }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 60px 20px 100px; position: relative; }
  .home-link{
    position: absolute; top: 22px; right: 22px;
    font-size: 12px; letter-spacing: 0.05em; color: var(--ink); opacity: .4;
    text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; transition: opacity .2s ease, border-color .2s ease;
  }
  .home-link:hover{ opacity: .8; border-color: var(--gold); }
  h1{
    font-family: 'Noto Serif TC', serif; font-weight: 900;
    font-size: 30px; color: var(--plum); margin: 0 0 8px; text-align:center;
  }
  .sub{ text-align:center; font-size: 13px; opacity: .55; margin-bottom: 40px; }

  .panel{
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 28px; margin-bottom: 20px;
  }

  label{ display:block; font-size: 12px; letter-spacing: 0.05em; opacity: .6; margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type{ margin-top: 0; }
  label.sub-field{ opacity: .45; font-size: 11px; margin-top: 10px; }
  input[type=password], input[type=text], input[type=date], input[type=url], textarea{
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--paper-soft); color: var(--ink);
  }
  textarea{ resize: vertical; min-height: 80px; line-height: 1.6; }
  input:focus, textarea:focus{ outline: 2px solid var(--gold); outline-offset: 1px; }

  button{
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 8px; padding: 13px 20px; cursor: pointer;
    width: 100%; margin-top: 22px; transition: opacity .2s ease;
  }
  button:hover{ opacity: .88; }
  button:disabled{ opacity: .5; cursor: not-allowed; }
  .btn-primary{ background: var(--plum); color: var(--paper); }
  .btn-secondary{ background: transparent; color: var(--ink); border: 1px solid var(--line); }

  .hint{ font-size: 12px; opacity: .5; margin-top: 10px; line-height: 1.6; }
  .msg{ font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 16px; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background: rgba(76,122,92,0.12); color: var(--green); }
  .msg.err{ background: rgba(184,69,60,0.1); color: var(--red); }

  .day-block{ border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
  .day-block:first-of-type{ border-top: none; padding-top: 0; margin-top: 0; }
  .day-title{ font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px; color: var(--plum); margin-bottom: 2px; }
  .day-date-preview{ font-size: 12px; opacity: .45; margin-bottom: 10px; }

  .hidden{ display: none; }
  .row{ display:flex; gap: 10px; }
  .row button{ flex: 1; }
  .section-title{
    font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 15px;
    color: var(--plum); margin: 0 0 4px;
  }
  .section-desc{ font-size: 12px; opacity: .5; margin-bottom: 4px; line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">
  <a class="home-link" href="index.html">回首頁</a>
  <h1>後台管理</h1>
  <div class="sub">呷奔｜一週菜單專用系統</div>

  <!-- 步驟 1：密碼登入 -->
  <div class="panel" id="loginPanel">
    <label for="pw">密碼</label>
    <input type="password" id="pw" placeholder="請輸入管理員密碼">
    <button class="btn-primary" id="loginBtn">登入</button>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <!-- 步驟 2：GitHub 權杖 + 讀取菜單 -->
  <div class="panel hidden" id="tokenPanel">
    <label for="owner">GitHub 帳號</label>
    <input type="text" id="owner" value="jason315826">
    <label for="repo">Repository 名稱</label>
    <input type="text" id="repo" value="ITRI_weekly-menu">
    <label for="token">GitHub 權杖 (Personal Access Token)</label>
    <input type="password" id="token" placeholder="貼上你的 token">
    <div class="hint">
      <!-- 去 GitHub 右上角頭像 → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token。Repository access 選這個 repo,Permissions 裡把 <b>Contents</b> 設成 Read and write。權杖只會存在你自己的瀏覽器裡。-->
    </div>
    <button class="btn-primary" id="loadBtn">讀取目前菜單</button>
    <div class="msg err" id="tokenMsg"></div>
  </div>

  <!-- 步驟 3：編輯表單 -->
  <div class="panel hidden" id="editPanel">
    <label for="weekStart">本週「週一」的日期</label>
    <input type="date" id="weekStart">
    <div class="hint">選擇本週「週一」的日期系統將自動計算並顯示正確日期。</div>

    <button type="button" class="btn-secondary" id="clearAllBtn" style="margin-top:16px">清除全部品項</button>

    <div id="daysContainer"></div>

    <label for="notes">備註（每行一條）</label>
    <textarea id="notes" placeholder="（一）、當日菜單請以群組為主。"></textarea>

    <label for="orderLink">訂餐系統按鈕連結</label>
    <input type="url" id="orderLink" placeholder="https://...">
    <div class="hint">此按鈕可以連動到揪團系統。</div>

    <div class="row">
      <button class="btn-primary" id="saveBtn">儲存並發布</button>
    </div>
    <button class="btn-secondary" id="logoutBtn">登出</button>
    <div class="msg" id="saveMsg"></div>
  </div>
</div>

<script>
  // ---- 這裡改你自己的後台密碼 ----
  const ADMIN_PASSWORD = "itri18899";
  const DAY_NAMES = ['週一','週二','週三','週四','週五'];

  const loginPanel = document.getElementById('loginPanel');
  const tokenPanel = document.getElementById('tokenPanel');
  const editPanel = document.getElementById('editPanel');
  let currentSha = null;
  let currentData = null;

  if (sessionStorage.getItem('menuAdminAuthed') === '1') {
    showTokenPanel();
  }

  document.getElementById('loginBtn').onclick = () => {
    const pw = document.getElementById('pw').value;
    if (pw === ADMIN_PASSWORD) {
      sessionStorage.setItem('menuAdminAuthed', '1');
      showTokenPanel();
    } else {
      showMsg('loginMsg', '密碼錯誤,請再試一次', false);
    }
  };

  function showTokenPanel(){
    loginPanel.classList.add('hidden');
    tokenPanel.classList.remove('hidden');
    const savedToken = localStorage.getItem('menuAdminToken');
    if (savedToken) document.getElementById('token').value = savedToken;
  }

  function showMsg(id, text, ok){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }

  function apiBase(){
    const owner = document.getElementById('owner').value.trim();
    const repo = document.getElementById('repo').value.trim();
    return `https://api.github.com/repos/${owner}/${repo}/contents/menu.json`;
  }

  function pad2(n){ return String(n).padStart(2, '0'); }
  function addDays(dateStr, n){
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d;
  }

  document.getElementById('loadBtn').onclick = async () => {
    const token = document.getElementById('token').value.trim();
    if (!token) { showMsg('tokenMsg', '請輸入 GitHub 權杖', false); return; }
    localStorage.setItem('menuAdminToken', token);

    try{
      const res = await fetch(apiBase(), {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) {
        showMsg('tokenMsg', `讀取失敗(${res.status})：請確認帳號/repo名稱正確、權杖有效且有 Contents 讀寫權限`, false);
        return;
      }
      const file = await res.json();
      currentSha = file.sha;
      currentData = JSON.parse(b64DecodeUtf8(file.content));
      delete currentData.presets;
      currentData.days.forEach(d => {
        if (d.lunchLink === undefined) d.lunchLink = '';
        if (d.drinkLink === undefined) d.drinkLink = '';
      });
      renderEditForm(currentData);
      tokenPanel.classList.add('hidden');
      editPanel.classList.remove('hidden');
    }catch(err){
      showMsg('tokenMsg', '連線失敗：' + err.message, false);
    }
  };

  function renderEditForm(data){
    document.getElementById('weekStart').value = data.weekStart;
    document.getElementById('notes').value = (data.notes || []).join('\n');
    document.getElementById('orderLink').value = data.orderLink || '';

    const container = document.getElementById('daysContainer');
    container.innerHTML = data.days.map((d, i) => `
      <div class="day-block">
        <div class="day-title">${DAY_NAMES[i]}</div>
        <div class="day-date-preview" data-preview="${i}"></div>

        <div class="section-title">中餐</div>
        <label>品項</label>
        <input type="text" data-idx="${i}" data-field="lunch" value="${(d.lunch||'').replace(/"/g,'&quot;')}">
        <label class="sub-field">中餐超連結（選填）</label>
        <input type="url" data-idx="${i}" data-field="lunchLink" value="${(d.lunchLink||'').replace(/"/g,'&quot;')}" placeholder="https://...">

        <div class="section-title" style="margin-top:16px">下午茶飲料</div>
        <label>品項</label>
        <input type="text" data-idx="${i}" data-field="drink" value="${(d.drink||'').replace(/"/g,'&quot;')}">
        <label class="sub-field">飲料超連結（選填）</label>
        <input type="url" data-idx="${i}" data-field="drinkLink" value="${(d.drinkLink||'').replace(/"/g,'&quot;')}" placeholder="https://...">

        <button type="button" class="btn-secondary day-clear-btn" data-clear-idx="${i}" style="margin-top:14px">清除本日品項</button>
      </div>
    `).join('');
    renderDayPreviewDates(data.weekStart);

    document.querySelectorAll('.day-clear-btn').forEach(btn => {
      btn.onclick = () => {
        const i = btn.dataset.clearIdx;
        if (!confirm(`確定要清除${DAY_NAMES[i]}的中餐與下午茶品項嗎？`)) return;
        ['lunch','lunchLink','drink','drinkLink'].forEach(field => {
          const input = document.querySelector(`[data-idx="${i}"][data-field="${field}"]`);
          if (input) input.value = '';
        });
      };
    });
  }

  function renderDayPreviewDates(weekStart){
    if (!weekStart) return;
    for (let i = 0; i < 5; i++){
      const dt = addDays(weekStart, i);
      const el = document.querySelector(`[data-preview="${i}"]`);
      if (el) el.textContent = `${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())}`;
    }
  }

  document.getElementById('clearAllBtn').onclick = () => {
    if (!confirm('確定要清除全部 5 天的中餐與下午茶品項嗎？')) return;
    document.querySelectorAll('#daysContainer input[data-field]').forEach(input => {
      input.value = '';
    });
  };

  document.getElementById('weekStart').addEventListener('change', (e) => {
    renderDayPreviewDates(e.target.value);
  });

  document.getElementById('saveBtn').onclick = async () => {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '儲存中…';

    currentData.weekStart = document.getElementById('weekStart').value;
    currentData.notes = document.getElementById('notes').value
      .split('\n').map(s => s.trim()).filter(Boolean);
    currentData.orderLink = document.getElementById('orderLink').value.trim();
    currentData.lastUpdated = new Date().toISOString();

    document.querySelectorAll('#daysContainer input[data-field]').forEach(inp => {
      currentData.days[inp.dataset.idx][inp.dataset.field] = inp.value.trim();
    });

    const token = document.getElementById('token').value.trim();
    const newContent = b64EncodeUtf8(JSON.stringify(currentData, null, 2));

    try{
      const res = await fetch(apiBase(), {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: '更新菜單（後台）',
          content: newContent,
          sha: currentSha
        })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        showMsg('saveMsg', `儲存失敗(${res.status})：${errData.message || '請檢查權杖權限'}`, false);
        btn.disabled = false;
        btn.textContent = '儲存並發布';
        return;
      }
      const result = await res.json();
      currentSha = result.content.sha;
      showMsg('saveMsg', '已儲存！網站約 1 分鐘後會更新完成', true);
    }catch(err){
      showMsg('saveMsg', '儲存失敗：' + err.message, false);
    }
    btn.disabled = false;
    btn.textContent = '儲存並發布';
  };

  document.getElementById('logoutBtn').onclick = () => {
    sessionStorage.removeItem('menuAdminAuthed');
    localStorage.removeItem('menuAdminToken');
    location.reload();
  };
</script>

</body>
</html>
